<script>
  (function () {
    var linkedName = document.getElementById('home-static-name');
    if (linkedName) {
      var staticName = linkedName.cloneNode(true);
      staticName.removeAttribute('role');
      staticName.removeAttribute('tabindex');
      staticName.style.cursor = 'default';
      linkedName.parentNode.replaceChild(staticName, linkedName);
    }
    var player = document.getElementById('home-turntable');
    var control = document.getElementById('home-tonearm-control');
    if (!player || !control) return;
    var audioController = window.PortfolioAudio;
    function syncPlayer(playing) {
      player.classList.toggle('is-playing', playing);
      control.setAttribute('aria-pressed', playing ? 'true' : 'false');
      control.setAttribute('aria-label', playing ? 'Stop the record player' : 'Start the record player');
    }
    syncPlayer(!!(audioController && audioController.isPlaying()));
    document.addEventListener('portfolio-audio-change', function (event) {
      syncPlayer(!!event.detail.playing);
    });
    control.addEventListener('click', function () {
      if (audioController) audioController.toggle(true);
    });
  })();
</script>

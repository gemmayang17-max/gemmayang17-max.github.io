#side .idrule{position:absolute;left:24px;top:310px;width:330px;height:1px;background:var(--ink-muted)}
#side .meta{position:absolute;left:24px;top:330px;width:300px;font:400 12px/16px var(--sans);white-space:pre-wrap}
#divider{position:absolute;left:375px;top:55px;width:1px;height:1360px;background:var(--ink)}

#list{position:absolute;left:376px;top:115px;width:1064px}
.row{position:relative;display:block;width:1064px;cursor:pointer}
.rowtop{position:relative;display:block;width:1064px;height:80px}
.rrule{position:absolute;left:24px;top:0;width:1016px;height:1px;background:var(--rule)}
#finalrule{position:relative;margin-left:24px;width:1016px;height:1px;background:var(--rule)}
.num{position:absolute;left:44px;top:24px;width:64px;font:400 18px/20px var(--serif);color:var(--ink)}
.ttl{position:absolute;left:132px;top:13px;width:760px;font:400 48px/50px var(--serif);color:var(--ink);white-space:nowrap}
.arw{position:absolute;left:1000px;top:25px;width:22px;height:22px}
.arw img{display:block;width:100%;height:100%}
.num,.ttl,.arw{transition:transform .6s var(--ease),color .45s var(--ease),opacity .45s var(--ease)}

/* --- the reveal: row opens downward, preview 1064x420 with the image inset 24 / 6 --- */
.prev{display:block;width:1064px;height:0;overflow:hidden;
  transition:height .62s var(--ease)}
.prevbox{display:block;margin:6px 24px 22px;width:1016px;height:392px;overflow:hidden;
  opacity:0;transform:scale(1.04);
  transition:opacity .5s var(--ease),transform .8s var(--ease)}
.prevbox img{display:block;width:100%;height:100%;object-fit:cover}
.row:hover .prev{height:420px}
.row:hover .prevbox{opacity:1;transform:scale(1)}
/* active state — number, title and arrow pick up the accent, as in the component's Active layers */
.row:hover .num{color:var(--accent)}
.row:hover .ttl{color:var(--accent);transform:translateX(14px)}
.row:hover .arw{transform:translate(10px,-10px)}
#list .row:hover{opacity:1}
#list:hover .row:not(:hover) .ttl,#list:hover .row:not(:hover) .num{opacity:1}
@media (prefers-reduced-motion:reduce){
  .prev,.prevbox,.num,.ttl,.arw{transition:none}
}
</style>

<script>
(function(){
  var st=document.getElementById('stage'),vp=document.getElementById('viewport'),
      hd=document.getElementById('siteheader'),list=document.getElementById('list'),
      div=document.getElementById('divider'),scale=1;
  function layout(){
    var h=Math.max(1440,115+list.offsetHeight+64);
    st.style.height=h+'px';
    div.style.height=(h-80)+'px';
    var geometry=window.portfolioCanvasLayout(vp.clientWidth,innerHeight);
    scale=geometry.scale;
    st.style.left=geometry.left+'px';
    st.style.transform='scale('+scale+')';
    hd.style.transform='scale('+(vp.clientWidth/1440)+')';
    vp.style.height=(h*scale)+'px';
  }
  layout();addEventListener('resize',layout);
  /* keep the canvas height in step while a row opens or closes */
  var raf=null,until=0;
  function track(){layout();if(performance.now()<until)raf=requestAnimationFrame(track);else raf=null;}
  list.addEventListener('mouseover',kick);list.addEventListener('mouseout',kick);
  function kick(){until=performance.now()+750;if(!raf)raf=requestAnimationFrame(track);}
})();
</script>
